[package]
name = "agent-env-guard"
version = "0.1.10"
edition = "2021"
description = "Run commands while masking configured environment secret values from stdout and stderr."
license = "MIT"
readme = "README.md"
repository = "https://github.com/ctxinf/agent-env-guard"
homepage = "https://github.com/ctxinf/agent-env-guard"
keywords = ["cli", "secrets", "masking", "agent", "security"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "maskrun"
path = "src/main.rs"

[dependencies]
globset = "0.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
