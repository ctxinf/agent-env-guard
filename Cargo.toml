[package]
name = "agent-env-guard"
version = "0.1.0"
edition = "2021"
description = "Run commands while masking configured environment secret values from stdout and stderr."
license = "MIT"

[[bin]]
name = "maskrun"
path = "src/main.rs"

[dependencies]
globset = "0.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
